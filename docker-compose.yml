services:
  searxng:
    image: searxng/searxng:latest
    container_name: local-llm-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_SECRET_KEY=local-llm-chatbot-searxng-secret-key-change-me
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
